name: Web convert (site → Actions)

on:
  push:
    branches: [inbox]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    # 20 (Python-путь) + 8 на Node-захват: setup-node+npm ci+Chromium ≤7м,
    # сам сейвер урезан 300с, раскладка 120с
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - name: Overlay tooling from main (inbox has only input.zip + workflow)
        run: |
          set -euo pipefail
          git fetch origin main --depth 1
          # package.json/package-lock.json/scripts нужны URL-режиму (Node-захват),
          # иначе setup-node(cache:npm) и npm ci падают — на inbox их нет
          git checkout origin/main -- .codespace backend package.json package-lock.json scripts
          git status --short

      - name: Detect mode (ссылка или готовый input.zip)
        id: mode
        run: |
          set -euo pipefail
          if [ -f fetch-url.txt ]; then
            URL=$(tr -d '\r\n' < fetch-url.txt)
            echo "mode=url" >> "$GITHUB_OUTPUT"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "SAVER_URL=$URL" >> "$GITHUB_ENV"
            echo "ссылка на игру: $URL"
          else
            echo "mode=zip" >> "$GITHUB_OUTPUT"
            echo "ссылки нет — берём input.zip, Node-захват пропускаем"
          fi

      - name: Fetch game assets by URL (если пришла ссылка)
        env:
          SPINE_PROXY_SERVER: ${{ secrets.SPINE_PROXY_SERVER }}
        run: |
          set -euo pipefail
          if [ ! -f fetch-url.txt ]; then echo "ссылки нет — берём input.zip"; exit 0; fi
          URL=$(tr -d '\r\n' < fetch-url.txt)
          echo "ссылка на игру: $URL"
          python3 -m pip install --quiet playwright aiohttp brotli
          # Resources Saver: кладём распакованное расширение рядом с браузером
          EXT_DIR="${RUNNER_TEMP}/Resources-Saver/src"
          if [ ! -d "$EXT_DIR" ]; then
            git clone --depth 1 --quiet https://github.com/Alex313031/Resources-Saver.git \
              "${RUNNER_TEMP}/Resources-Saver" || true
          fi
          echo "SPINE_EXT_DIR=$EXT_DIR" >> "$GITHUB_ENV"
          # резидентный прокси для браузера: снимает гео-блокировки и капчу.
          # Задаётся секретом SPINE_PROXY_SERVER вида http://user:pass@host:port
          if [ -n "${SPINE_PROXY_SERVER:-}" ]; then
            echo "SPINE_PROXY_SERVER настроен"
          else
            echo "::warning::SPINE_PROXY_SERVER не задан — браузер идёт напрямую с IP runner'а"
          fi
          [ -d "$EXT_DIR" ] && echo "расширение Resources-Saver: подключено" || echo "расширение: недоступно, работаем без него"
          # страховка от зависания: весь шаг обязан уложиться в 9 минут
          set +e
          # файл + живой прогресс в логе; хвост читает отдельный процесс,
          # поэтому браузер не может удержать шаг (в отличие от конвейера)
          ( timeout -k 15 75 python3 -u .codespace/fetch_assets.py "$URL" -o input.zip \
              --max-mb 300 --total-budget 55 --budget-ms 18000 > fetch-log.txt 2>&1 ) &
          FETCH_PID=$!
          tail -n +1 -f fetch-log.txt &
          TAIL_PID=$!
          wait $FETCH_PID
          RC=$?
          kill $TAIL_PID >/dev/null 2>&1 || true
          pkill -f 'chrome|chromium' >/dev/null 2>&1 || true
          set -e
          echo "выкачивание завершено с кодой $RC"
          if [ "$RC" = "124" ] || [ "$RC" = "137" ]; then
            echo "::warning::выкачивание не уложилось в 75 секунд — берём то, что успело"
          fi
          rm -f fetch-url.txt
          unzip -l input.zip | head -30

      # ── Node-захват (URL-режим) ────────────────────────────────────────────
      # Python-путь выше не трогаем: его бюджеты (55с/75с) — предел здоровья.
      # Это запасной headless-сейвер, он только дополняет выборку и отчёт.
      - name: Setup Node (URL-режим)
        if: steps.mode.outputs.mode == 'url'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps + Playwright Chromium (URL-режим)
        if: steps.mode.outputs.mode == 'url'
        continue-on-error: true
        env:
          SPINE_PROXY_SERVER: ${{ secrets.SPINE_PROXY_SERVER }}
        run: |
          set -uo pipefail
          # install не должен утащить весь job: 7 минут потолок на оба шага
          timeout -k 10 420 bash -c 'npm ci --no-audit --no-fund && npx playwright install chromium --with-deps' \
            > npm-install-log.txt 2>&1
          RC=$?
          tail -n 40 npm-install-log.txt
          if [ "$RC" = "0" ]; then
            echo "node_modules и Chromium готовы" >> "$GITHUB_ENV"
          else
            echo "::warning::установка Node/Chromium не удалась (код $RC) — сейвер пропустим"
          fi
          exit 0

      - name: Headless saver → ZIP + saver-report.json (URL-режим)
        if: steps.mode.outputs.mode == 'url'
        continue-on-error: true
        env:
          URLS: ${{ steps.mode.outputs.url }}
          GAME_URL: ${{ steps.mode.outputs.url }}
          WAIT_MS: "35000"
          OUTPUT_DIR: saver-out
          HEADLESS: "true"
          PROXY: ${{ secrets.SPINE_PROXY_SERVER }}
        run: |
          set -uo pipefail
          if [ "${NODE_READY:-0}" != "1" ]; then
            echo "::warning::Node/Chromium не установлены — пропускаю захват"
            exit 0
          fi
          # потолок 5 минут на весь прогон (WAIT_MS=35с на прогон + доборка из манифестов)
          set +e
          timeout -k 10 300 node scripts/download-resources.mjs 2>&1 | tee saver-log.txt
          RC=${PIPESTATUS[0]}
          set -e
          echo "сейвер завершился с кодом $RC"
          if [ "$RC" = "124" ] || [ "$RC" = "137" ]; then
            echo "::warning::сейвер не уложился в 300 секунд — забираем то, что есть"
          fi
          ls -la saver-out || true
          find saver-out -name 'saver-report.json' -exec cat {} \; || true
          exit 0

      - name: spine-pack.mjs → res/spine/ (если скрипт есть)
        if: steps.mode.outputs.mode == 'url'
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ ! -f scripts/spine-pack.mjs ]; then
            echo "scripts/spine-pack.mjs нет в репозитории — раскладка пропущена"
            exit 0
          fi
          ZIP=$(ls -t saver-out/*.zip 2>/dev/null | head -1 || true)
          if [ -z "${ZIP:-}" ]; then
            echo "ZIP сейвера не найден — раскладка не нужна"
            exit 0
          fi
          # раскладывает содержимое сейвера в res/spine/ (atlas/skel/bin + текстуры)
          timeout -k 10 120 node scripts/spine-pack.mjs "$ZIP" res || \
            echo "::warning::spine-pack.mjs упал — раскладка частичная"
          find res -type f 2>/dev/null | head -20 || true
          exit 0

      - name: Добираем Spine в input.zip (если Python-путь ничего не нашёл)
        if: steps.mode.outputs.mode == 'url'
        continue-on-error: true
        run: |
          set -uo pipefail
          # Строго дополнение: если в input.zip уже есть atlas/skel — не трогаем его.
          # Ветка спасения нужна ровно для случая "ссылка была, Python не добрал Spine".
          python3 - <<'PY'
          import os, sys, zipfile, glob
          src = "input.zip"
          if not os.path.exists(src):
              sys.exit(0)
          with zipfile.ZipFile(src) as z:
              names = z.namelist()
          have = any(n.lower().endswith((".atlas", ".skel")) for n in names)
          if have:
              print("в input.zip уже есть Spine — оставляем как есть")
              sys.exit(0)
          cands = []
          if os.path.isdir("res"):
              cands = ["res"]
          else:
              cands = [d for d in glob.glob("saver-out/*/") if os.path.isfile(os.path.join(d, "saver-report.json"))]
          cands = [d for d in cands if any(f.endswith((".atlas", ".skel")) for _, _, fs in os.walk(d) for f in fs)]
          if not cands:
              print("ни Python, ни сейвер не нашли Spine — шаг пустой")
              sys.exit(0)
          added = 0
          with zipfile.ZipFile(src, "a", zipfile.ZIP_DEFLATED) as z:
              existing = set(names)
              for d in cands:
                  for root, _, files in os.walk(d):
                      for f in files:
                          full = os.path.join(root, f)
                          arc = os.path.relpath(full, d).replace(os.sep, "/")
                          if arc in existing:
                              continue
                          z.write(full, arc)
                          added += 1
          print("дописано из сейвера файлов: %d" % added)
          PY
          unzip -l input.zip | head -30
          exit 0

      - name: Отчёт сейвера в summary (URL-режим)
        if: ${{ always() && steps.mode.outputs.mode == 'url' }}
        run: |
          set -uo pipefail
          N=$(find saver-out -type f 2>/dev/null | wc -l || true)
          A=$(find saver-out -type f -name '*.atlas' 2>/dev/null | wc -l || true)
          K=$(find saver-out -type f -name '*.skel'  2>/dev/null | wc -l || true)
          B=$(find saver-out -type f -name '*.bin'   2>/dev/null | wc -l || true)
          printf '### Headless saver (URL-режим)\nфайлов: %s | atlas: %s | skel: %s | bin: %s\n\n' \
            "$N" "$A" "$K" "$B" >> "$GITHUB_STEP_SUMMARY"

      - name: Hash analyzer → rename (hash→asset_name) if hashed
        run: |
          set -euo pipefail
          test -f input.zip || { echo "input.zip не найден на ветке inbox"; exit 1; }
          python3 .codespace/prepare_input.py input.zip input.zip

      - name: Unpack block → /images (atlases → subfolders, параллельно)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 .codespace/unpack_block.py input.zip input.zip

      - name: Convert input.zip (native Linux converter, параллельно)
        env:
          CONVERT_WORKERS: "8"
          # лечение битых скелетов (U+FFFD): SPINE_REPAIR=1 включает
          SPINE_REPAIR: "1"
          SPINE_REPAIR_BUDGET: "1200"
          SPINE_REPAIR_MIN_CONFIDENCE: "0.5"
          SPINE_REPAIR_MAX_FILES: "60"
          SPINE_REPAIR_TIME_LIMIT: "20"
          SPINE_REPAIR_ALLOW_TAIL: "0.2"
        run: |
          set -euo pipefail
          test -f input.zip || { echo "input.zip не найден на ветке inbox"; exit 1; }
          python3 .codespace/convert.py input.zip output.zip
          unzip -l output.zip

      - name: Publish baseline results (json + images) to results branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          JOB="$(git log -1 --format=%s)"
          echo "$JOB" > job-id.txt
          cp output.zip /tmp/publish-output.zip
          rm -rf publish && mkdir publish
          cd publish
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin results; then
            git checkout -q -B results FETCH_HEAD
          else
            git checkout -q --orphan results
            git rm -rq --cached . 2>/dev/null || true
          fi
          cp /tmp/publish-output.zip output.zip
          git -c user.name="3Spine-bot" -c user.email="3Spine-bot@users.noreply.github.com" add -A output.zip
          git -c user.name="3Spine-bot" -c user.email="3Spine-bot@users.noreply.github.com" commit -qm "results baseline $(date -u +%FT%TZ) (job in artifact, ожидаем .spine)"
          git push -q origin results

      - name: Upload conversion artifact for compile block
        uses: actions/upload-artifact@v4
        with:
          name: convert-output
          path: |
            output.zip
            job-id.txt
          if-no-files-found: error

      - name: Upload saver artifacts (zip + saver-report.json)
        if: ${{ always() && steps.mode.outputs.mode == 'url' }}
        uses: actions/upload-artifact@v4
        with:
          name: saver-assets-${{ github.run_id }}
          path: |
            saver-out/**/*.zip
            saver-out/**/saver-report.json
            saver-log.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Clean inbox branch (no loop on delete event)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete inbox || true

  compile:
    needs: convert
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Overlay tooling from main
        run: |
          set -euo pipefail
          git fetch origin main --depth 1
          git checkout origin/main -- .codespace
          git status --short

      - name: Download conversion artifact
        uses: actions/download-artifact@v4
        with:
          name: convert-output
          path: work
          run-id: ${{ github.run_id }}

      - name: Install x11/gl deps (headless Spine)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            xvfb x11-xserver-utils x11-utils x11-xkb-utils \
            libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 \
            libgtk-3-0t64 libxtst6 libxrender1 libxrandr2 libxinerama1 \
            libxcursor1 libxi6 libasound2t64 fonts-liberation || true
          sudo ldconfig || true

      - name: Cache Spine editor bundle
        uses: actions/cache@v4
        with:
          path: /tmp/spine
          key: spine-linux-${{ runner.os }}-v1
          restore-keys: |
            spine-linux-${{ runner.os }}-

      - name: Purge broken editor updates
        run: |
          set -euo pipefail
          # кеш прошлых прогонов мог сохранить недоскачанный файл версии —
          # редактор потом падает с "integrity check failed"
          mkdir -p ~/.spine/updates
          for f in ~/.spine/updates/*; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$sz" -lt 5000000 ]; then echo "удаляю битую версию: $f ($sz байт)"; rm -f "$f"; fi
          done
          ls -la ~/.spine/updates || true

      - name: Download licensed Spine Linux launcher
        env:
          SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
        run: |
          set -euo pipefail
          if [ -x /tmp/spine/Spine/Spine.sh ]; then
            echo "Spine уже в кеше — пропускаю скачивание"
            exit 0
          fi
          curl -sL --max-time 600 --retry 2 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36" \
            "$SPINE_LINUX_URL" -o /tmp/linux.gz
          gzip -d /tmp/linux.gz
          mkdir -p /tmp/spine
          tar xf /tmp/linux -C /tmp/spine
          ls /tmp/spine

      - name: "Compile block → .spine (все проекты одновременно)"
        env:
          SPINE_EDITOR: /tmp/spine/Spine/Spine.sh
          SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
          SPINE_XMX: "768"
          # все Spine-проекты стартуют одновременно: без пачек и без прогона
          SPINE_BATCH: "0"
          SPINE_WARMUP: "0"
          SPINE_TIMEOUT: "2400"
        run: |
          set -euo pipefail
          test -f work/output.zip || { echo "work/output.zip не найден"; exit 1; }
          # Свой Xvfb на фиксированном дисплее: DISPLAY должен быть виден не только
          # главному процессу Spine, но и его legacy-подпроцессу (редактор 3.8.99),
          # иначе он падает с HeadlessException и всё уходит в 4.x
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          for i in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          export DISPLAY=:99
          printf '#!/bin/sh\nexec /tmp/spine/Spine/Spine.sh "$@"\n' > /tmp/spine-run.sh
          chmod +x /tmp/spine-run.sh
          xdpyinfo -display :99 | head -2 || true
          echo "CPU: $(nproc) → все скелеты одним запуском, параллельно по числу ядер"

          # Компиляция Spine и распаковка спрайтов идут ОДНОВРЕМЕННО,
          # каждая в своей копии архива; в конце быстро мержим в финальный zip.
          cp work/output.zip work/compile.zip
          rm -rf work/sprites-src work/sprites-out
          mkdir -p work/sprites-src work/sprites-out
          unzip -q work/output.zip -d work/sprites-src

          python3 -m pip install --quiet Pillow

          ( python3 .codespace/unpack_atlases.py work/sprites-src --output work/sprites-out \
              > /tmp/sprites.log 2>&1; echo $? > /tmp/sprites.rc ) &
          SPRITES_PID=$!
          echo "распаковка спрайтов запущена в фоне (pid $SPRITES_PID)"

          # жёсткий лимит на компиляцию + одна повторная попытка:
          # без этого job может висеть на Spine бесконечно
          set +e
          timeout --kill-after=120 "$SPINE_TIMEOUT" \
            python3 .codespace/compile_block.py work/compile.zip work/compile.zip
          COMPILE_RC=$?
          if [ "$COMPILE_RC" -ne 0 ]; then
            echo "компиляция Spine не удалась (код $COMPILE_RC) — повторяю один раз"
            timeout --kill-after=120 "$SPINE_TIMEOUT" \
              python3 .codespace/compile_block.py work/compile.zip work/compile.zip
            COMPILE_RC=$?
          fi
          set -e
          echo "компиляция Spine завершилась с кодом $COMPILE_RC"

          wait "$SPRITES_PID" || true
          SPRITES_RC="$(cat /tmp/sprites.rc 2>/dev/null || echo 1)"
          echo "распаковка спрайтов завершилась с кодом $SPRITES_RC, спрайтов: $(find work/sprites-out -type f 2>/dev/null | wc -l)"
          [ "$SPRITES_RC" = "0" ] || tail -20 /tmp/sprites.log || true

          python3 .codespace/merge_sprites_into_zip.py work/compile.zip work/sprites-out work/output.zip
          unzip -l work/output.zip | tail -5

      - name: Logout Spine license
        if: always()
        run: |
          timeout 300 /tmp/spine/Spine/Spine.sh -l 2>&1 | tail -20 || true

      - name: Publish final results (with .spine) to results branch + history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          JOB="$(cat work/job-id.txt 2>/dev/null || true)"
          [ -n "${JOB}" ] || JOB="${{ github.event.head_commit.message }}"
          SAFE="$(printf '%s' "$JOB" | tr -c 'A-Za-z0-9._-' '_')"
          NOW="$(date -u +%FT%TZ)"
          cp work/output.zip /tmp/publish-output.zip
          rm -rf publish && mkdir publish
          cd publish
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin results; then
            git checkout -q -B results FETCH_HEAD
          else
            git checkout -q --orphan results
            git rm -rq --cached . 2>/dev/null || true
          fi
          mkdir -p history
          cp /tmp/publish-output.zip output.zip
          cp /tmp/publish-output.zip "history/${SAFE}.zip"
          BYTES="$(stat -c %s /tmp/publish-output.zip)"
          SPINE="$(unzip -l /tmp/publish-output.zip | grep -c '\.spine$' || true)"
          JOB="$JOB" SAFE="$SAFE" NOW="$NOW" BYTES="$BYTES" SPINE="$SPINE" python3 - <<'PY'
          import json, os
          path = "history/index.json"
          items = []
          if os.path.exists(path):
              try:
                  items = json.load(open(path, encoding="utf-8")).get("items", [])
              except Exception:
                  items = []
          entry = {
              "job": os.environ["JOB"],
              "file": "history/%s.zip" % os.environ["SAFE"],
              "bytes": int(os.environ["BYTES"]),
              "date": os.environ["NOW"],
              "spine": int(os.environ["SPINE"] or 0) > 0,
          }
          items = [i for i in items if i.get("job") != entry["job"]]
          items.insert(0, entry)
          os.makedirs("history", exist_ok=True)
          json.dump({"items": items}, open(path, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
          git -c user.name="3Spine-bot" -c user.email="3Spine-bot@users.noreply.github.com" add -A output.zip history
          git -c user.name="3Spine-bot" -c user.email="3Spine-bot@users.noreply.github.com" commit -qm "results ${JOB} +<spine> ${NOW}"
          git push -q origin results