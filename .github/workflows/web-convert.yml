name: Web convert (site → Actions)

on:
  push:
    branches: [inbox]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Overlay tooling from main (inbox has only input.zip + workflow)
        run: |
          set -euo pipefail
          git fetch origin main --depth 1
          git checkout origin/main -- .codespace backend
          git status --short

      - name: Hash analyzer → rename (hash→asset_name) if hashed
        run: |
          set -euo pipefail
          test -f input.zip || { echo "input.zip не найден на ветке inbox"; exit 1; }
          python3 .codespace/prepare_input.py input.zip input.zip

      - name: Unpack block → /images (atlases → subfolders)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 .codespace/unpack_block.py input.zip input.zip

      - name: Convert input.zip (native Linux converter)
        run: |
          set -euo pipefail
          test -f input.zip || { echo "input.zip не найден на ветке inbox"; exit 1; }
          python3 .codespace/convert.py input.zip output.zip
          unzip -l output.zip

      - name: Publish baseline results (json + images) to results branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          JOB="$(git log -1 --format=%s)"
          echo "$JOB" > job-id.txt
          rm -rf publish && mkdir publish && cp output.zip publish/
          cd publish
          git init -q
          git checkout -q -b results
          git -c user.name="3Spine-bot" -c user.email="3Spine-bot@users.noreply.github.com" add output.zip
          git -c user.name="3Spine-bot" -c user.email="3Spine-bot@users.noreply.github.com" commit -qm "results ${JOB} $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" results

      - name: Upload conversion artifact for compile block
        uses: actions/upload-artifact@v4
        with:
          name: convert-output
          path: |
            output.zip
            job-id.txt
          if-no-files-found: error

      - name: Clean inbox branch (no loop on delete event)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete inbox || true

  compile:
    needs: convert
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Overlay tooling from main
        run: |
          set -euo pipefail
          git fetch origin main --depth 1
          git checkout origin/main -- .codespace
          git status --short

      - name: Download conversion artifact
        uses: actions/download-artifact@v4
        with:
          name: convert-output
          path: work
          run-id: ${{ github.run_id }}

      - name: Install x11/gl deps (headless Spine)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            xvfb x11-xserver-utils x11-utils x11-xkb-utils \
            libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 \
            libgtk-3-0t64 libxtst6 libxrender1 libxrandr2 libxinerama1 \
            libxcursor1 libxi6 libasound2t64 fonts-liberation || true
          sudo ldconfig || true

      - name: Download licensed Spine Linux launcher
        env:
          SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
        run: |
          set -euo pipefail
          curl -sL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36" \
            "$SPINE_LINUX_URL" -o /tmp/linux.gz
          gzip -d /tmp/linux.gz
          mkdir -p /tmp/spine
          tar xf /tmp/linux -C /tmp/spine
          ls /tmp/spine

      - name: Compile block → .spine (Spine Linux, версия по JSON)
        env:
          SPINE_EDITOR: /tmp/spine/Spine/Spine.sh
          SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
        run: |
          set -euo pipefail
          test -f work/output.zip || { echo "work/output.zip не найден"; exit 1; }
          printf '#!/bin/sh\nexec xvfb-run -a /tmp/spine/Spine/Spine.sh "$@"\n' > /tmp/spine-run.sh
          chmod +x /tmp/spine-run.sh
          python3 .codespace/compile_block.py work/output.zip work/output.zip
          unzip -l work/output.zip

      - name: Logout Spine license
        if: always()
        run: |
          timeout 300 xvfb-run -a /tmp/spine/Spine/Spine.sh -l 2>&1 | tail -20 || true

      - name: Publish final results (with .spine) to results branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          JOB="$(cat work/job-id.txt 2>/dev/null || true)"
          [ -n "${JOB}" ] || JOB="${{ github.event.head_commit.message }}"
          rm -rf publish && mkdir publish && cp work/output.zip publish/
          cd publish
          git init -q
          git checkout -q -b results
          git -c user.name="3Spine-bot" -c user.email="3Spine-bot@users.noreply.github.com" add output.zip
          git -c user.name="3Spine-bot" -c user.email="3Spine-bot@users.noreply.github.com" commit -qm "results ${JOB} +<spine> $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" results