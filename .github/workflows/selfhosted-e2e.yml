name: Self-hosted E2E (Linux runner, from Docker)

on:
  workflow_dispatch:

jobs:
  self-hosted-runner:
    runs-on: [self-hosted, linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Native converter executes on the self-hosted Linux runner
        run: |
          docker build -t spine-backend:runner ./backend
          mkdir -p /tmp/shr
          docker run --rm -v "$PWD/examples/plum.skel:/data/plum.skel:ro" -v /tmp/shr:/data spine-backend:runner \
            /opt/spine-converter/converter/SpineSkeletonDataConverter /data/plum.skel /data/plum.json
          docker run --rm -i -v /tmp/shr:/data spine-backend:runner \
            python3 -c "import json; d=json.load(open('/data/plum.json')); assert d['skeleton']['spine'].startswith('3.8'); print('ROUNDTRIP OK on self-hosted runner — spine', d['skeleton']['spine'], '| bones', len(d['bones']))"