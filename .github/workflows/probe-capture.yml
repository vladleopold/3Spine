name: Probe capture

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL игры для прямого захвата'
        required: true
        type: string

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установка KTX-транскодера и тест на реальном .ktx
        env:
          KTX_BUILD_FROM_SOURCE: '0'
        run: |
          .codespace/pg-extractor/install-ktx-tools.sh || true
          echo "--- итог установки:"
          for t in ktx2ktx2 toktx ktx basisu convert; do
            command -v "$t" >/dev/null 2>&1 && echo "есть: $t ($(command -v $t))"
          done
          # проверяем на настоящем файле из игры: какой вызов даёт PNG
          G=694acf9f9578f7f47887ea81e8da87c9
          B=https://demogamesfree.pragmaticplay.net/gs2c/common/v3/games-html5/games/vs/vs20bgdoghouse/desktop/game
          mkdir -p /tmp/ktxtest && cd /tmp/ktxtest
          curl -sL --max-time 60 -o t.ktx "$B/res/$G.ktx" || true
          ls -l t.ktx | awk '{print "ktx: " $5 " байт"}'
          try() { echo "--- пробую: $*"; "$@" >/dev/null 2>&1 || true; }
          if command -v ktx2ktx2 >/dev/null; then
            echo "--- ktx2ktx2 --decode (в uncompressed KTX2):"
            ktx2ktx2 --decode t.ktx t_dec.ktx2 2>&1 | tail -n 3 || true
            ls -l t_dec.ktx2 2>/dev/null | awk '{print "  dec: " $5 " байт"}' || echo "  dec не получился"
            echo "--- заголовок декодированного:"
            python3 -c "import struct,sys;d=open('t_dec.ktx2','rb').read();vk,ts,w,h,dep,lay,fac,lev,sup=struct.unpack_from('<9I',d,12);print(f'  vkFormat={vk} w={w} h={h} supercompression={sup}');dfd,dfdl=struct.unpack_from('<2I',d,48);print(f'  dfd@{dfd}+{dfdl}');body=d[dfd:dfd+dfdl];print('  dfd:',body[:24].hex(' ')) if dfdl else None" || echo "  разбор не удался"
          fi

      - name: Прямой захват
        run: |
          mkdir -p out
          python3 .codespace/capture_pgsoft.py "${{ inputs.url }}" out --max-index 20 || true
          echo "--- итог:"
          echo "файлов: $(ls out/*.json 2>/dev/null | wc -l), картинок: $(find out/images -type f 2>/dev/null | wc -l)"
          du -sh out 2>/dev/null | tail -1
