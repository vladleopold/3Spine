name: Deploy broker worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLIENT_ID: 54d11594-84e4-41aa-b438-e81b8fa78ee7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh Cloudflare OAuth access token
        run: |
          set -euo pipefail
          RESP="$(curl -s -X POST "https://dash.cloudflare.com/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "User-Agent: wrangler/4.0.0" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "refresh_token=${{ secrets.CF_WRANGLER_OAUTH }}")"
          TOKEN="$(printf '%s' "$RESP" | jq -r '.access_token // empty')"
          test -n "$TOKEN" || { echo "oauth refresh failed: $RESP"; exit 1; }
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy worker to Cloudflare
        working-directory: worker
        run: npx wrangler@latest deploy

      - name: Store GITHUB_TOKEN as worker secret
        working-directory: worker
        env:
          GH_TOKEN_VALUE: ${{ secrets.ACCESS_TOKEN }}
        run: printf '%s' "${GH_TOKEN_VALUE}" | npx wrangler@latest secret put GITHUB_TOKEN