name: Deploy broker worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLIENT_ID: 54d11594-84e4-41aa-b438-e81b8fa78ee7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh Cloudflare OAuth access token
        run: |
          set -euo pipefail
          RESP="$(curl -s -X POST "https://dash.cloudflare.com/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "User-Agent: wrangler/4.0.0" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "refresh_token=${{ secrets.CF_WRANGLER_OAUTH }}")"
          TOKEN="$(printf '%s' "$RESP" | jq -r '.access_token // empty')"
          test -n "$TOKEN" || { echo "oauth refresh failed: $RESP"; exit 1; }
          {
            echo "CLOUDFLARE_API_TOKEN=$TOKEN"
            echo "REFRESH_RESP=$RESP"
          } >> "$GITHUB_ENV"

      - name: Rotate CF_WRANGLER_OAUTH (dash rotates refresh tokens)
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          NEW_RT="$(printf '%s' "${REFRESH_RESP}" | jq -r '.refresh_token // empty')"
          test -n "${NEW_RT}" || { echo "no new refresh token in response"; exit 0; }
          printf '%s' "${NEW_RT}" | gh secret set CF_WRANGLER_OAUTH -R "${GITHUB_REPOSITORY}"

      - name: Ensure KV namespace for visit stats
        working-directory: worker
        run: |
          set -euo pipefail
          TITLE="spine-broker-visits"
          ID="$(npx wrangler@latest kv namespace list --json | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .id' | head -1)"
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            ID="$(npx wrangler@latest kv namespace create "$TITLE" --json | jq -r '.id')"
            echo "created KV namespace $TITLE ($ID)"
          else
            echo "using existing KV namespace $TITLE ($ID)"
          fi
          if ! grep -q 'binding = "VISITS"' wrangler.toml; then
            printf '\n[[kv_namespaces]]\nbinding = "VISITS"\nid = "%s"\n' "$ID" >> wrangler.toml
          else
            KV_ID="$ID" python3 -c 'import os,re; p="wrangler.toml"; s=open(p).read(); s=re.sub(r"(binding = \"VISITS\"\nid = \")[^\"]*", lambda m: m.group(1)+os.environ["KV_ID"], s); open(p,"w").write(s)'
          fi
          tail -5 wrangler.toml

      - name: Deploy worker to Cloudflare
        working-directory: worker
        run: npx wrangler@latest deploy

      - name: Store GITHUB_TOKEN as worker secret
        working-directory: worker
        env:
          GH_TOKEN_VALUE: ${{ secrets.ACCESS_TOKEN }}
        run: printf '%s' "${GH_TOKEN_VALUE}" | npx wrangler@latest secret put GITHUB_TOKEN