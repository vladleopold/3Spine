name: 3Spine frontend smoke CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-smoke:
    name: Frontend source integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate HTML entrypoint and controls
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          grep -q 'src="./app.js"' index.html
          grep -q 'id="create"' index.html
          grep -q 'id="file"' index.html
          grep -q 'accept=".psd' index.html
          echo 'Frontend smoke checks passed.'
