name: Probe net

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL для проверки'
        required: true
        type: string
      proxy:
        description: 'HTTP-прокси (host:port)'
        required: false
        type: string
      relay:
        description: 'Публикатор (шаблон с {url})'
        required: false
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Прямо
        run: |
          echo "== напрямую:"
          curl -sS -o /dev/null -w "HTTP %{http_code}, %{size_download} байт\n" --max-time 30 "${{ inputs.url }}" || echo "прямой запрос не прошёл"
      - name: Через прокси
        if: ${{ inputs.proxy != '' }}
        run: |
          echo "== через прокси ${{ inputs.proxy }} (схема http):"
          U="$(printf '%s' '${{ inputs.url }}' | sed 's|^https://|http://|')"
          curl -sS -o /dev/null -w "HTTP %{http_code}, %{size_download} байт\n" --max-time 40 -x "${{ inputs.proxy }}" "$U" || echo "прокси не ответил"
      - name: Через публикатор
        if: ${{ inputs.relay != '' }}
        env:
          RELAY_TOKEN: ${{ secrets.SPINE_PROXY_TOKEN }}
        run: |
          E="$(printf '%s' '${{ inputs.url }}' | python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read(),safe=''))")"
          R="$(printf '%s' '${{ inputs.relay }}' | sed "s|{url}|$E|")"
          echo "== через публикатор:"
          curl -sS -o /dev/null -w "HTTP %{http_code}, %{size_download} байт\n" --max-time 40 -H "X-Spine-Token: ${RELAY_TOKEN}" "$R" || echo "публикатор не ответил"
