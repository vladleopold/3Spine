name: Converter CI/CD (Linux in Docker)

on:
  push:
    branches: [main]
    paths: ["backend/**", "docker-compose.yml", "examples/**"]
  workflow_dispatch:

jobs:
  # ---- check: построить образ и гонять конвертер в Docker-Linux ----
  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image (Linux)
        run: docker build -t spine-backend:ci ./backend

      - name: Convert real .skel fixtures with the native converter
        run: |
          mkdir -p /tmp/ci
          for sk in examples/*.skel; do
            echo "== $sk =="
            docker run --rm -v "$PWD:/repo" -v /tmp/ci:/data spine-backend:ci \
              /opt/spine-converter/converter/SpineSkeletonDataConverter \
              "/repo/$sk" "/data/$(basename "$sk" .skel).json" 2>&1 | tail -3 || true
          done
          docker run --rm -i -v /tmp/ci:/data spine-backend:ci \
            python3 - <<'PY'
          import json, pathlib
          # строгая проверка: plum.skel обязан конвертиться полностью
          d = json.load(open("/data/plum.json"))
          spine = d["skeleton"]["spine"]
          assert spine.startswith("3.8"), spine
          assert len(d["bones"]) == 5
          assert len(d["slots"]) == 4
          assert len(d["animations"]) == 1
          print("PLUM OK — spine", spine, "| bones 5 | slots 4 | anim 1")
          PY

      - name: HTTP service health
        run: |
          docker run -d --name spine-backend-test -p 18080:8080 spine-backend:ci
          sleep 3
          curl -fsS http://127.0.0.1:18080/health
          echo
          docker rm -f spine-backend-test