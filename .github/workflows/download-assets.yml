name: Download Slot Resources

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URL через запятую (пусто = дефолтный список из 7 игр)'
        required: false
        type: string
      wait_ms:
        description: 'Доп. ожидание после загрузки (мс)'
        required: false
        default: '35000'
        type: string
      full:
        description: 'Прогнать все URL в одной job вместо матрицы'
        required: false
        default: 'false'
        type: string

jobs:
  tests:
    name: Тесты логики сейвера
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: unit-тесты (пути, манифесты, Spine-пары)
        run: npm test

  download:
    name: ${{ matrix.name }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: first-ua-kendoo
            url: 'https://first.ua/ua/igrovie-avtomaty/kendoo/4-gold-carts'
          - name: slotcity-spinjoy
            url: 'https://slotcity.ua/?modals=game&game-term=spinjoy-meduzas-fortune&demo=true'
          - name: cosmolot-demonic-dolls
            url: 'https://cosmolot.ua/ua/game/demonic-dolls'
          - name: playson-clover-strike
            url: 'https://playson.com/game/clover-strike-hold-and-win'
          - name: 3oaks-superpower-diamonds
            url: 'https://3oaks.com/game/3_superpower_diamonds'
          - name: slotor777-demo
            url: 'https://slotor777.ua/ru/game/view/56dab5f9954f459f919d800306e48b35?mode=demo'
          - name: beton-dog-house
            url: 'https://beton.ua/game/pragmaticplay-direct-the-dog-house-megaways-1000?isDemo=true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - name: Установить Google Chrome (Linux)
        run: |
          bash scripts/install-chrome-linux.sh
          google-chrome --version
          echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"


      - uses: actions/cache@v4
        id: ext-cache
        with:
          path: .chrome-ext
          key: ext-resources-saver-${{ github.run_id }}
          restore-keys: |
            ext-resources-saver-

      - name: Установить расширение Resources-Saver
        run: bash scripts/install-resources-saver.sh

      - name: Запустить Chrome с расширением
        env:
          URL: ${{ inputs.full == 'true' && inputs.urls || matrix.url }}
          EXT_DIR: .chrome-ext
          PROFILE: ${{ github.workspace }}/.chrome-profile
        run: bash scripts/start-chrome.sh

      - name: Открыть DevTools
        run: bash scripts/open-devtools.sh

      - name: Нажать Save All Resources в Resources Saver
        env:
          URL: ${{ inputs.full == 'true' && inputs.urls || matrix.url }}
          OUTPUT_DIR: ./artifacts
          EXT_DIR: .chrome-ext
          PROFILE: ${{ github.workspace }}/.chrome-profile
        run: node scripts/press-save-all.mjs

      - name: Дождаться архива (отдельный шаг)
        env:
          OUTPUT_DIR: ./artifacts
          ARCHIVE_WAIT_MS: '120000'
        run: node scripts/wait-archive.mjs

      - name: Скачать все ресурсы игры
        env:
          URLS: ${{ inputs.full == 'true' && inputs.urls || matrix.url }}
          OUTPUT_DIR: ./artifacts
          WAIT_MS: ${{ inputs.wait_ms || '35000' }}
          HEADLESS: 'true'
        run: node scripts/download-resources.mjs

      - name: Отчёт по Spine
        if: always()
        run: |
          set -euo pipefail
          A=$(find artifacts -type f -name '*.atlas' 2>/dev/null | wc -l)
          K=$(find artifacts -type f -name '*.skel'  2>/dev/null | wc -l)
          B=$(find artifacts -type f -name '*.bin'   2>/dev/null | wc -l)
          N=$(find artifacts -type f 2>/dev/null | wc -l)
          IMG=$(find artifacts -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.webp' -o -name '*.avif' \) 2>/dev/null | wc -l)
          printf '### %s\nфайлов: %s | atlas: %s | skel: %s | bin: %s | картинок: %s\n\n' \
            "${{ matrix.name }}" "$N" "$A" "$K" "$B" "$IMG" >> "$GITHUB_STEP_SUMMARY"
          echo "файлов=$N atlas=$A skel=$K bin=$B img=$IMG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slot-${{ matrix.name }}-${{ github.run_id }}
          path: artifacts
          retention-days: 14
          if-no-files-found: warn
