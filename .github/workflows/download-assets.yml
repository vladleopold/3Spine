name: Download Slot Resources

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URL через запятую (пусто = дефолтный список из 7 игр)'
        required: false
        type: string
      wait_ms:
        description: 'Доп. ожидание после загрузки (мс)'
        required: false
        default: '35000'
        type: string
      full:
        description: 'Прогнать все URL в одной job вместо матрицы'
        required: false
        default: 'false'
        type: string
      spa_depth:
        description: 'Глубина обхода состояний SPA'
        required: false
        default: '3'
        type: string
      spa_states:
        description: 'Максимум состояний SPA за прогон'
        required: false
        default: '40'
        type: string
      spa_wait:
        description: 'Пауза на устаканивание DOM в SPA (мс)'
        required: false
        default: '1200'
        type: string
      spa_include:
        description: 'Селекторы, по которым кликать (пусто = все)'
        required: false
        type: string
      spa_exclude:
        description: 'Селекторы, которые не кликать'
        required: false
        type: string

jobs:
  tests:
    name: Тесты логики сейвера
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: unit-тесты (пути, манифесты, Spine-пары)
        run: npm test

  download:
    name: ${{ matrix.name }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: first-ua-kendoo
            url: 'https://first.ua/ua/igrovie-avtomaty/kendoo/4-gold-carts'
          - name: slotcity-spinjoy
            url: 'https://slotcity.ua/?modals=game&game-term=spinjoy-meduzas-fortune&demo=true'
          - name: cosmolot-demonic-dolls
            url: 'https://cosmolot.ua/ua/game/demonic-dolls'
          - name: playson-clover-strike
            url: 'https://playson.com/game/clover-strike-hold-and-win'
          - name: 3oaks-superpower-diamonds
            url: 'https://3oaks.com/game/3_superpower_diamonds'
          - name: xplatform-beez-turn-wild
            url: 'https://xplatformwl-lrs.box-int-54f2g.com/launch?key=TEST1100000&partner=playsonsite-prod&wl=pl_gate&gameName=beez_turn_wild_mob&lang=en'
          - name: slotcity-threeoaks-volcano
            url: 'https://slotcity.ua/?modals=game&game-term=new-threeoaks-coin-up-volcano&demo=true'
          - name: slotor777-demo
            url: 'https://slotor777.ua/ru/game/view/56dab5f9954f459f919d800306e48b35?mode=demo'
          - name: beton-dog-house
            url: 'https://beton.ua/game/pragmaticplay-direct-the-dog-house-megaways-1000?isDemo=true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Скачать через AnyDownload (render)
        env:
          URL: ${{ inputs.full == 'true' && inputs.urls || matrix.url }}
          WAIT_MS: ${{ inputs.spa_wait || '4000' }}
        run: |
          npm install -g anydownload@2.3.9
          mkdir -p artifacts/anydownload
          printf 'n\n' | timeout 900 anydownload "$URL" \
            --mode render \
            --headless \
            --wait "$WAIT_MS" \
            --preset page \
            -o artifacts/anydownload \
            -v
          echo "файлов AnyDownload: $(find artifacts/anydownload -type f | wc -l)"

      - name: Восстановить имена файлов (hash_to_name)
        continue-on-error: true
        run: |
          # файлы приходят хеш-именами (кэш CDN) → возвращаем originals по манифестам игры
          python3 .codespace/hash_to_name/manifest_resolver.py artifacts/anydownload --apply
          python3 .codespace/hash_to_name/restore_names_cli.py artifacts/anydownload

      - name: Собрать spine-паки
        run: node scripts/spine-pack.mjs artifacts/anydownload artifacts/spine

      - name: Распаковать спрайты из атласов
        continue-on-error: true
        run: |
          python3 -m pip install --quiet Pillow
          mkdir -p artifacts/sprites
          UNPACK_LAYOUT=global python3 .codespace/unpack_atlases.py artifacts/anydownload \
            --output artifacts/sprites
          echo "распакованных спрайтов: $(find artifacts/sprites -type f | wc -l)"

      - name: Отчёт по Spine
        if: always()
        run: |
          set -euo pipefail
          A=$(find artifacts -type f -name '*.atlas' 2>/dev/null | wc -l)
          K=$(find artifacts -type f -name '*.skel'  2>/dev/null | wc -l)
          B=$(find artifacts -type f -name '*.bin'   2>/dev/null | wc -l)
          N=$(find artifacts -type f 2>/dev/null | wc -l)
          IMG=$(find artifacts -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.webp' -o -name '*.avif' \) 2>/dev/null | wc -l)
          printf '### %s\nфайлов: %s | atlas: %s | skel: %s | bin: %s | картинок: %s\n\n' \
            "${{ matrix.name }}" "$N" "$A" "$K" "$B" "$IMG" >> "$GITHUB_STEP_SUMMARY"
          echo "файлов=$N atlas=$A skel=$K bin=$B img=$IMG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slot-${{ matrix.name }}-${{ github.run_id }}
          path: artifacts
          retention-days: 14
          if-no-files-found: warn
