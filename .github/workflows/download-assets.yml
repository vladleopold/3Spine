name: Download Slot Resources

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URL через запятую (пусто = дефолтный список из 7 игр)'
        required: false
        type: string
      wait_ms:
        description: 'Доп. ожидание после загрузки (мс)'
        required: false
        default: '35000'
        type: string
      full:
        description: 'Прогнать все URL в одной job вместо матрицы'
        required: false
        default: 'false'
        type: string
      spa_depth:
        description: 'Глубина обхода состояний SPA'
        required: false
        default: '3'
        type: string
      spa_states:
        description: 'Максимум состояний SPA за прогон'
        required: false
        default: '40'
        type: string
      spa_wait:
        description: 'Пауза на устаканивание DOM в SPA (мс)'
        required: false
        default: '1200'
        type: string
      spa_include:
        description: 'Селекторы, по которым кликать (пусто = все)'
        required: false
        type: string
      spa_exclude:
        description: 'Селекторы, которые не кликать'
        required: false
        type: string
      attempts:
        description: 'Сколько попыток скачать через AnyDownload'
        required: false
        default: '3'
        type: string
      try_timeout:
        description: 'Лимит секунд на одну попытку AnyDownload'
        required: false
        default: '480'
        type: string
      min_files:
        description: 'Минимум файлов, иначе считаем что игра не загрузилась'
        required: false
        default: '10'
        type: string

jobs:
  tests:
    name: Тесты логики сейвера
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: unit-тесты (пути, манифесты, Spine-пары)
        run: npm test

  single:
    name: Один запуск по списку URL
    needs: tests
    if: ${{ inputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Прямой захват PG Soft идёт первым: браузер для него не нужен, а его
      # установка (Chromium ~115 МБ) занимает почти 5 минут.
      - name: Прямой захват PG Soft по каждому URL
        id: pgsoft_pre
        run: |
          echo "$URLS" | tr ',' '\n' | sed '/^[[:space:]]*$/d' | while read -r url; do
            case "$url" in
              *html5Game.do*|*openGame.do*)
                slug=$(printf '%s' "$url" | md5sum | cut -c1-8)
                dir="artifacts/$slug"
                mkdir -p "$dir"
                echo "=== прямой захват: $url"
                python3 .codespace/capture_pgsoft.py "$url" "$dir" --max-index 60 || true
                echo "прямой захват: $(find "$dir/images" -type f 2>/dev/null | wc -l) картинок"
                ;;
            esac
          done
          N=$(find artifacts -path '*/images/*' -type f 2>/dev/null | wc -l)
          echo "всего картинок после прямого захвата: $N"
          if [ "$N" -ge 10 ]; then echo "captured=true" >> "$GITHUB_OUTPUT"; fi

      - name: Скачать через AnyDownload (render) по каждому URL
        if: ${{ steps.pgsoft_pre.outputs.captured != 'true' }}
        env:
          URLS: ${{ inputs.urls }}
          WAIT_MS: ${{ inputs.spa_wait || '8000' }}
          ATTEMPTS: ${{ inputs.attempts || '3' }}
          TRY_TIMEOUT: ${{ inputs.try_timeout || '480' }}
          MIN_FILES: ${{ inputs.min_files || '10' }}
          # публикатор выключен по умолчанию: на проверенной игре он давал 0 файлов
          FB_WAIT_MS: ${{ inputs.wait_ms || '35000' }}
        run: |
          # AnyDownload: вендоренная сборка, браузер ставит сам Playwright
          npm install --prefix vendor/anydownload --no-audit --no-fund
          AD="node vendor/anydownload/bin/cli.js"
          i=0
          echo "$URLS" | tr ',' '\n' | sed '/^[[:space:]]*$/d' | while read -r url; do
            i=$((i + 1))
            slug=$(printf '%s' "$url" | md5sum | cut -c1-8)
            dir="artifacts/$slug"
            mkdir -p "$dir"
            best=0
            for a in $(seq 1 "$ATTEMPTS"); do
              [ "$(find "$dir/images" -type f 2>/dev/null | wc -l)" -ge 10 ] && break
              try="$dir.try-$a"
              rm -rf "$try"; mkdir -p "$try"
              echo "=== [$i] $url — попытка $a/$ATTEMPTS"
              printf 'n\n' | timeout --kill-after=30 "$TRY_TIMEOUT" $AD "$url" \
                --mode render --headless --wait "$WAIT_MS" --preset page -o "$try" \
                -v || true
              n=$(find "$try" -type f 2>/dev/null | wc -l)
              echo "попытка $a: файлов $n"
              if [ "$n" -gt "$best" ]; then
                best=$n; rm -rf "$dir.keep"; mv "$try" "$dir.keep"
              else
                rm -rf "$try"
              fi
            done
            mkdir -p "$dir"
            [ -d "$dir.keep" ] && mv "$dir.keep"/* "$dir"/ 2>/dev/null || true
            rm -rf "$dir.keep"
            got=$(find "$dir" -type f | wc -l)
            echo "$url -> $dir ($got файлов)"
            echo "$url" > "$dir/url.txt"
            if [ "$got" -lt "$MIN_FILES" ]; then
              echo "::warning::$url — AnyDownload взял $got файлов, пробуем резервный захват"
              rm -rf "$dir"; mkdir -p "$dir"
              OUTPUT_DIR="$dir" URL="$url" WAIT_MS="$FB_WAIT_MS" HEADLESS=true \
                node scripts/download-resources.mjs || true
              echo "фолбэк: $url -> $(find "$dir" -type f | wc -l) файлов"
            fi
          done

      - name: Прагматик Play — собрать Spine-пары из UHT-ресурсов
        continue-on-error: true
        run: |
          set -uo pipefail
          for d in artifacts/*/; do
            [ -f "$d/url.txt" ] || continue
            # UHT-ресурсы лежат рядом с картинками; если их нет — игра не PG
            N=$(find "$d" -maxdepth 2 -type f \( -name 'main_resources*.json' \
                -o -name 'other_resources*.json' -o -name 'game*.json' \
                -o -name 'GUI*.json' -o -name 'resources*.json' \) | wc -l)
            if [ "$N" -eq 0 ]; then
              echo "=== $d: UHT-ресурсов нет, пропускаю"
              continue
            fi
            echo "=== $d: UHT-ресурсов $N, запускаю экстрактор"
            python3 .codespace/pg-extractor/extract_uht_spine.py "$d" \
              -o "$d/pg_extracted" --fetch-cdn || true
            P=$(find "$d/pg_extracted/spine_projects" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l)
            echo "$d: Spine-пар из UHT: $P"
            # готовые .json + .atlas + .png кладём рядом, чтобы spine-pack их собрал
            if [ "$P" -gt 0 ]; then
              mkdir -p "$d/pg_spine"
              find "$d/pg_extracted/spine_projects" -mindepth 2 -maxdepth 2 -type f \
                \( -name '*.json' -o -name '*.atlas' -o -name '*.png' \) \
                -exec cp {} "$d/pg_spine/" \;
              echo "$d: в pg_spine $(find "$d/pg_spine" -type f | wc -l) файлов"
            fi
          done

      - name: Восстановить имена файлов (hash_to_name)
        continue-on-error: true
        run: |
          for d in artifacts/*/; do
            [ -f "$d/url.txt" ] || continue
            echo "=== $d"
            python3 .codespace/hash_to_name/manifest_resolver.py "$d" --apply || true
            python3 .codespace/hash_to_name/restore_names_cli.py "$d" || true
          done

      - name: Вернуть .skel бинарникам, лежащим под .json
        if: always()
        continue-on-error: true
        run: |
          for d in artifacts/*/; do
            [ -f "$d/url.txt" ] || continue
            python3 .codespace/fix_skeleton_ext.py "$d"
          done

      - name: Собрать spine-паки
        run: |
          for d in artifacts/*/; do
            [ -f "$d/url.txt" ] || continue
            node scripts/spine-pack.mjs "$d" "$d/spine"
          done

      - name: Распаковать спрайты из атласов
        continue-on-error: true
        run: |
          python3 -m pip install --quiet Pillow
          for d in artifacts/*/; do
            [ -f "$d/url.txt" ] || continue
            mkdir -p "$d/sprites"
            UNPACK_LAYOUT=global python3 .codespace/unpack_atlases.py "$d" --output "$d/sprites" || true
            echo "$d: распакованных спрайтов $(find "$d/sprites" -type f | wc -l)"
          done

      - name: Распаковать картинки, спрятанные в JSON (base64 → PNG)
        if: always()
        continue-on-error: true
        run: |
          for d in artifacts/*/; do
            [ -f "$d/url.txt" ] || continue
            python3 .codespace/extract_inline_images.py "$d" --min-kb 1 || true
          done

      - name: Отчёт по Spine
        if: always()
        run: |
          set -euo pipefail
          for d in artifacts/*/; do
            [ -f "$d/url.txt" ] || continue
            N=$(find "$d" -type f | wc -l)
            A=$(find "$d" -type f -name '*.atlas' | wc -l)
            K=$(find "$d" -type f -name '*.skel' | wc -l)
            B=$(find "$d" -type f -name '*.bin' | wc -l)
            IMG=$(find "$d" -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.webp' -o -name '*.avif' \) | wc -l)
            MB=$(du -sm "$d" | cut -f1)
            printf '### %s\nфайлов: %s | atlas: %s | skel: %s | bin: %s | картинок: %s | МБ: %s\n\n' \
              "$(cat "$d/url.txt")" "$N" "$A" "$K" "$B" "$IMG" "$MB" >> "$GITHUB_STEP_SUMMARY"
            echo "$d файлов=$N atlas=$A skel=$K bin=$B img=$IMG МБ=$MB"
            du -sm "$d"/* 2>/dev/null | sort -n | awk '{printf "  %s: %s МБ\n", $2, $1}'
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slots-${{ github.run_id }}
          path: artifacts
          retention-days: 14
          if-no-files-found: warn

  download:
    name: ${{ matrix.name }}
    needs: tests
    if: ${{ inputs.full != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: first-ua-kendoo
            url: 'https://first.ua/ua/igrovie-avtomaty/kendoo/4-gold-carts'
          - name: slotcity-spinjoy
            url: 'https://slotcity.ua/?modals=game&game-term=spinjoy-meduzas-fortune&demo=true'
          - name: cosmolot-demonic-dolls
            url: 'https://cosmolot.ua/ua/game/demonic-dolls'
          - name: playson-clover-strike
            url: 'https://playson.com/game/clover-strike-hold-and-win'
          - name: 3oaks-superpower-diamonds
            url: 'https://3oaks.com/game/3_superpower_diamonds'
          - name: xplatform-beez-turn-wild
            url: 'https://xplatformwl-lrs.box-int-54f2g.com/launch?key=TEST1100000&partner=playsonsite-prod&wl=pl_gate&gameName=beez_turn_wild_mob&lang=en'
          - name: slotcity-threeoaks-volcano
            url: 'https://slotcity.ua/?modals=game&game-term=new-threeoaks-coin-up-volcano&demo=true'
          - name: slotor777-demo
            url: 'https://slotor777.ua/ru/game/view/56dab5f9954f459f919d800306e48b35?mode=demo'
          - name: beton-dog-house
            url: 'https://beton.ua/game/pragmaticplay-direct-the-dog-house-megaways-1000?isDemo=true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: "Прямой захват PG Soft (html5Game.do)"
        id: pgsoft
        continue-on-error: true
        run: |
          mkdir -p artifacts/anydownload
          case "$URL" in
            *html5Game.do*|*openGame.do*)
              echo "прямой захват: $URL"
              python3 .codespace/capture_pgsoft.py "$URL" artifacts/anydownload --max-index 60 || true
              IMGS=$(find artifacts/anydownload/images -type f 2>/dev/null | wc -l)
              echo "распаковано картинок: $IMGS"
              if [ "$IMGS" -ge 10 ]; then echo "captured=true" >> "$GITHUB_OUTPUT"; fi
              ;;
            *) echo "не html5Game.do — прямой захват не нужен" ;;
          esac

      - name: Скачать через AnyDownload (render)
        id: anydownload
        if: steps.pgsoft.outputs.captured != 'true'
        env:
          URL: ${{ inputs.full == 'true' && inputs.urls || matrix.url }}
          WAIT_MS: ${{ inputs.spa_wait || '8000' }}
          ATTEMPTS: ${{ inputs.attempts || '3' }}
          TRY_TIMEOUT: ${{ inputs.try_timeout || '480' }}
          FB_WAIT_MS: ${{ inputs.wait_ms || '35000' }}
        run: |
          # AnyDownload: вендоренная сборка, браузер ставит сам Playwright
          npm install --prefix vendor/anydownload --no-audit --no-fund
          AD="node vendor/anydownload/bin/cli.js"
          rm -rf artifacts/anydownload artifacts/anydownload.keep
          best=0
          for i in $(seq 1 "$ATTEMPTS"); do
            dir="artifacts/try-$i"
            rm -rf "$dir"; mkdir -p "$dir"
            echo "=== попытка $i/$ATTEMPTS, ожидание ${WAIT_MS} мс, лимит ${TRY_TIMEOUT}с"
            printf 'n\n' | timeout --kill-after=30 "$TRY_TIMEOUT" $AD "$URL" \
              --mode render \
              --headless \
              --wait "$WAIT_MS" \
              --preset page \
              -o "$dir" \
              \
              -v && rc=0 || rc=$?
            n=$(find "$dir" -type f 2>/dev/null | wc -l)
            a=$(find "$dir" -type f -name '*.atlas' 2>/dev/null | wc -l)
            echo "попытка $i: код $rc, файлов $n, атласов $a"
            if [ "$n" -gt "$best" ]; then
              best=$n
              rm -rf artifacts/anydownload.keep
              mv "$dir" artifacts/anydownload.keep
            else
              rm -rf "$dir"
            fi
          done
          mkdir -p artifacts/anydownload
          if [ -d artifacts/anydownload.keep ]; then mv artifacts/anydownload.keep/* artifacts/anydownload/ 2>/dev/null || true; fi
          rm -rf artifacts/anydownload.keep artifacts/try-* 2>/dev/null || true
          GOT=$(find artifacts/anydownload -type f | wc -l)
          echo "файлов AnyDownload: $GOT"
          if [ "$GOT" -lt "$MIN_FILES" ]; then
            echo "::error::AnyDownload сохранил всего $GOT файлов — игра не загрузилась (ссылка/сессия/гео?)"
            exit 1
          fi

      - name: "Фолбэк: резервный захват"
        if: failure() && steps.anydownload.outcome == 'failure'
        continue-on-error: true
        env:
          URL: ${{ inputs.full == 'true' && inputs.urls || matrix.url }}
          OUTPUT_DIR: ./artifacts/anydownload
          WAIT_MS: ${{ inputs.wait_ms || '35000' }}
          HEADLESS: 'true'
        run: node scripts/download-resources.mjs

      - name: Прагматик Play — собрать Spine-пары из UHT-ресурсов
        continue-on-error: true
        run: |
          set -uo pipefail
          for d in artifacts/*/; do
            [ -f "$d/url.txt" ] || continue
            # UHT-ресурсы лежат рядом с картинками; если их нет — игра не PG
            N=$(find "$d" -maxdepth 2 -type f \( -name 'main_resources*.json' \
                -o -name 'other_resources*.json' -o -name 'game*.json' \
                -o -name 'GUI*.json' -o -name 'resources*.json' \) | wc -l)
            if [ "$N" -eq 0 ]; then
              echo "=== $d: UHT-ресурсов нет, пропускаю"
              continue
            fi
            echo "=== $d: UHT-ресурсов $N, запускаю экстрактор"
            python3 .codespace/pg-extractor/extract_uht_spine.py "$d" \
              -o "$d/pg_extracted" --fetch-cdn || true
            P=$(find "$d/pg_extracted/spine_projects" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l)
            echo "$d: Spine-пар из UHT: $P"
            # готовые .json + .atlas + .png кладём рядом, чтобы spine-pack их собрал
            if [ "$P" -gt 0 ]; then
              mkdir -p "$d/pg_spine"
              find "$d/pg_extracted/spine_projects" -mindepth 2 -maxdepth 2 -type f \
                \( -name '*.json' -o -name '*.atlas' -o -name '*.png' \) \
                -exec cp {} "$d/pg_spine/" \;
              echo "$d: в pg_spine $(find "$d/pg_spine" -type f | wc -l) файлов"
            fi
          done

      - name: Восстановить имена файлов (hash_to_name)
        continue-on-error: true
        run: |
          # файлы приходят хеш-именами (кэш CDN) → возвращаем originals по манифестам игры
          python3 .codespace/hash_to_name/manifest_resolver.py artifacts/anydownload --apply
          python3 .codespace/hash_to_name/restore_names_cli.py artifacts/anydownload

      - name: Вернуть .skel бинарникам, лежащим под .json
        if: always()
        continue-on-error: true
        run: python3 .codespace/fix_skeleton_ext.py artifacts/anydownload

      - name: Собрать spine-паки
        if: always()
        continue-on-error: true
        run: node scripts/spine-pack.mjs artifacts/anydownload artifacts/spine

      - name: Распаковать спрайты из атласов
        if: always()
        continue-on-error: true
        run: |
          python3 -m pip install --quiet Pillow
          mkdir -p artifacts/sprites
          UNPACK_LAYOUT=global python3 .codespace/unpack_atlases.py artifacts/anydownload \
            --output artifacts/sprites
          echo "распакованных спрайтов: $(find artifacts/sprites -type f | wc -l)"

      - name: Распаковать картинки, спрятанные в JSON (base64 → PNG)
        if: always()
        continue-on-error: true
        run: python3 .codespace/extract_inline_images.py artifacts/anydownload --min-kb 1 || true

      - name: Отчёт по Spine
        if: always()
        run: |
          set -euo pipefail
          A=$(find artifacts -type f -name '*.atlas' 2>/dev/null | wc -l)
          K=$(find artifacts -type f -name '*.skel'  2>/dev/null | wc -l)
          B=$(find artifacts -type f -name '*.bin'   2>/dev/null | wc -l)
          N=$(find artifacts -type f 2>/dev/null | wc -l)
          IMG=$(find artifacts -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.webp' -o -name '*.avif' \) 2>/dev/null | wc -l)
          printf '### %s\nфайлов: %s | atlas: %s | skel: %s | bin: %s | картинок: %s\n\n' \
            "${{ matrix.name }}" "$N" "$A" "$K" "$B" "$IMG" >> "$GITHUB_STEP_SUMMARY"
          echo "файлов=$N atlas=$A skel=$K bin=$B img=$IMG"
          echo "--- размеры по каталогам (МБ):"
          du -sm artifacts/* 2>/dev/null | sort -n | awk '{printf "  %s: %s МБ\n", $2, $1}'
          echo "--- 10 самых тяжёлых файлов:"
          find artifacts -type f -printf '%s %p\n' 2>/dev/null | sort -rn | head -10 \
            | awk '{printf "  %.1f МБ %s\n", $1/1048576, $2}'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slot-${{ matrix.name }}-${{ github.run_id }}
          path: artifacts
          retention-days: 14
          if-no-files-found: warn
